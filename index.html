<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>David Jack Personal</title>
<style>
:root{
  --noite:#14120f; --noite2:#1e1b16; --madeira:#2b2419;
  --perg:#f4ead6; --perg2:#e8dbc0; --tinta:#221d15; --tinta2:#5d5241;
  --ouro:#c9a227; --ouro2:#8c6f14; --linha:#cbbb98;
  --verde:#2f6b46; --ambar:#a8730c; --vermelho:#a32c22;
  --r:12px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--noite);color:var(--perg);
  font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  padding-bottom:calc(84px + env(safe-area-inset-bottom));transition:padding-bottom .2s}
body.comdesc{padding-bottom:calc(178px + env(safe-area-inset-bottom))}
.wrap{max-width:820px;margin:0 auto;padding:0 14px}

/* ---------- cabeçalho ---------- */
header{background:linear-gradient(180deg,var(--madeira),var(--noite2));border-bottom:2px solid var(--ouro2);
  padding:calc(10px + env(safe-area-inset-top)) 0 10px;position:sticky;top:0;z-index:20}
.hd{display:flex;align-items:center;gap:12px}
.hd svg{width:44px;height:44px;flex:0 0 auto}
.hd h1{font-size:15px;margin:0;letter-spacing:.04em;text-transform:uppercase;color:var(--ouro);white-space:nowrap}
.hd p{margin:0;font-size:12px;color:#b8ab90}
.hd .modo{margin-left:auto;font-size:11px;border:1px solid var(--ouro2);color:var(--ouro);
  padding:6px 12px;border-radius:99px;text-transform:uppercase;letter-spacing:.05em;background:transparent;min-height:44px}

/* ---------- estrutura ---------- */
main{padding-top:14px}
.card{background:var(--perg);color:var(--tinta);border-radius:var(--r);padding:16px;margin:0 0 14px;
  border:1px solid var(--linha);box-shadow:0 2px 0 rgba(0,0,0,.35)}
.card.escuro{background:var(--noite2);color:var(--perg);border-color:#3a3227}
h2{font-size:18px;margin:0 0 4px}
h3{font-size:15px;margin:18px 0 8px;color:var(--tinta)}
.card.escuro h2,.card.escuro h3{color:var(--ouro)}
.sub{color:var(--tinta2);font-size:14px;margin:0 0 14px}
.card.escuro .sub{color:#b8ab90}
.linha{height:1px;background:var(--linha);margin:14px 0;border:0}

/* ---------- formulários ---------- */
label.q{display:block;font-weight:600;margin:0 0 6px;font-size:15px}
input,select,textarea{width:100%;padding:12px;font-size:16px;font-family:inherit;color:var(--tinta);
  background:#fffaf0;border:1px solid var(--linha);border-radius:10px;-webkit-appearance:none;appearance:none;min-height:48px}
textarea{min-height:90px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--ouro2);outline-offset:1px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:420px){.grid2{grid-template-columns:1fr}}

/* ---------- botões ---------- */
button{font:inherit;font-weight:700;min-height:48px;padding:12px 16px;border-radius:10px;cursor:pointer;
  border:1px solid var(--linha);background:var(--perg2);color:var(--tinta)}
button.pri{background:var(--ouro);border-color:var(--ouro2);color:#20180a}
button.esc{background:transparent;border-color:var(--ouro2);color:var(--ouro)}
button.perigo{background:#f6dcd8;border-color:#d9a49c;color:#7a1f18}
button:disabled{opacity:.45;cursor:default}
button.mini{min-height:48px;padding:10px 12px;font-size:14px;font-weight:600}
.btns{display:flex;flex-direction:column;gap:10px}
.btns.h{flex-direction:row;flex-wrap:wrap}
.btns.h button{flex:1 1 140px}

/* ---------- listas ---------- */
.item{display:flex;gap:12px;align-items:center;padding:12px;border:1px solid var(--linha);border-radius:10px;
  background:#fffaf0;margin:0 0 10px;width:100%;text-align:left;min-height:64px}
.item:active{background:var(--perg2)}
.item .nm{font-weight:700;font-size:16px;display:block}
.item .dt{font-size:13px;color:var(--tinta2);display:block}
.item .seta{margin-left:auto;color:var(--tinta2);font-size:20px}
.vazio{text-align:center;color:var(--tinta2);padding:26px 10px;font-size:15px}

/* ---------- semáforo e avisos ---------- */
.selo{display:inline-block;font-size:12px;font-weight:700;padding:4px 9px;border-radius:99px;
  text-transform:uppercase;letter-spacing:.04em;white-space:nowrap}
.selo.ok{background:#d7ecdf;color:var(--verde)}
.selo.aviso{background:#f7e7c8;color:var(--ambar)}
.selo.bloq{background:#f6dcd8;color:var(--vermelho)}
.aviso-bx{border-left:5px solid var(--ambar);background:#faf1de;border-radius:8px;padding:12px;margin:0 0 10px;font-size:14px}
.aviso-bx.bloq{border-left-color:var(--vermelho);background:#fbe9e6}
.aviso-bx.ok{border-left-color:var(--verde);background:#e9f4ed}
.aviso-bx b{display:block;margin-bottom:2px}

/* ---------- tabela de treino ---------- */
.ex{border:1px solid var(--linha);border-radius:10px;background:#fffaf0;padding:12px;margin:0 0 10px}
.ex .top{display:flex;gap:10px;align-items:flex-start}
.ex .nome{font-weight:700;flex:1}
.ex .meta{font-size:13px;color:var(--tinta2);margin-top:3px}
.ex .cue{font-size:13px;color:var(--tinta2);margin-top:6px;font-style:italic}
.pill{display:inline-block;background:var(--perg2);border:1px solid var(--linha);border-radius:99px;
  padding:3px 9px;font-size:12px;margin:4px 4px 0 0;color:var(--tinta2)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--linha)}
th{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--tinta2)}
.rolar{overflow-x:auto;-webkit-overflow-scrolling:touch}

/* ---------- execução da série ---------- */
.serie{display:grid;grid-template-columns:34px 1fr 1fr 1fr 52px;gap:8px;align-items:center;margin:0 0 8px}
.serie .n{font-weight:700;text-align:center;color:var(--tinta2)}
.serie input{min-height:52px;text-align:center;padding:8px 4px;font-size:17px}
.serie .feito{min-height:52px;border-radius:10px;border:1px solid var(--linha);background:var(--perg2);
  font-size:20px;font-weight:700;line-height:1}
.serie .feito.on{background:var(--verde);color:#fff;border-color:var(--verde)}
.cab-serie{display:grid;grid-template-columns:34px 1fr 1fr 1fr 52px;gap:8px;font-size:11px;
  text-transform:uppercase;color:var(--tinta2);margin:0 0 6px;text-align:center}
.desc{position:fixed;left:0;right:0;bottom:calc(84px + env(safe-area-inset-bottom));z-index:15;
  background:var(--madeira);border-top:2px solid var(--ouro2);padding:10px 14px;display:none}
.desc.on{display:block}
.desc .t{font-size:26px;font-weight:800;color:var(--ouro);text-align:center;font-variant-numeric:tabular-nums}

/* ---------- barra inferior ---------- */
nav.bar{position:fixed;left:0;right:0;bottom:0;z-index:18;background:var(--noite2);
  border-top:2px solid var(--ouro2);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
nav.bar .in{max-width:820px;margin:0 auto;display:flex}
nav.bar button{flex:1;background:transparent;border:0;color:#9b8f76;font-size:11px;font-weight:600;
  min-height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:4px}
nav.bar button.on{color:var(--ouro)}
nav.bar svg{width:22px;height:22px}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(74px + env(safe-area-inset-top));
  background:var(--madeira);color:var(--perg);border:1px solid var(--ouro2);border-radius:10px;
  padding:12px 16px;z-index:60;max-width:90%;font-size:14px;box-shadow:0 6px 20px rgba(0,0,0,.5);pointer-events:none}
.modal{position:fixed;inset:0;background:rgba(10,8,6,.72);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.modal .in{background:var(--perg);color:var(--tinta);border-radius:16px 16px 0 0;width:100%;max-width:820px;
  max-height:88vh;overflow:auto;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
@media(min-width:600px){.modal{align-items:center}.modal .in{border-radius:16px;max-height:82vh}}
/* ---------- listas, dicas e progresso ---------- */
ul.lista{margin:0 0 0 18px;padding:0}
ul.lista li{margin:0 0 4px}
.dica{font-size:12px;color:var(--tinta2);margin:6px 0 0;font-style:italic}
.item.destaque{border:2px solid var(--ouro2);background:#fff6e2}
.prog{height:10px;background:var(--perg2);border-radius:99px;overflow:hidden;margin-top:10px}
.prog>i{display:block;height:100%;background:var(--ouro);transition:width .25s}
.selos{display:flex;gap:6px;margin-top:12px}
.dia{flex:1;max-width:44px;aspect-ratio:1;border-radius:50%;border:1px solid var(--linha);background:#fffaf0;
  display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:var(--tinta2)}
.dia.on{background:var(--verde);border-color:var(--verde);color:#fff}
.dia.hoje{box-shadow:0 0 0 2px var(--ouro)}
.desc.urgente{background:#5a1f18}
.desc.urgente .t{color:#ffb4a6}
.marca{display:block;margin:0 auto}
.resumo{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0 4px}
.resumo>div{background:#fffaf0;border:1px solid var(--linha);border-radius:10px;padding:10px 6px;text-align:center}
.resumo b{display:block;font-size:17px;color:var(--tinta)}
.resumo span{display:block;font-size:11px;color:var(--tinta2);line-height:1.25;margin-top:2px}
@media(max-width:400px){.resumo{grid-template-columns:repeat(2,1fr)}}
/* celular deitado: sobra pouca altura, o rodape encolhe */
@media(max-height:460px){
  body{padding-bottom:calc(62px + env(safe-area-inset-bottom))}
  body.comdesc{padding-bottom:calc(140px + env(safe-area-inset-bottom))}
  nav.bar button{min-height:46px;font-size:10px}
  nav.bar svg{width:18px;height:18px}
  header{position:static}
  .desc{bottom:calc(62px + env(safe-area-inset-bottom));padding:6px 14px}
  .desc .t{font-size:20px}
}
.oculto{display:none!important}
/* ---------- impressão ---------- */
@media print{
  body{background:#fff;color:#000;padding:0}
  header,nav.bar,.desc,.btns,.modo,.toast,.dica,.selos{display:none!important}
  .card{background:#fff;color:#000;border:1px solid #999;box-shadow:none;break-inside:avoid;page-break-inside:avoid;margin:0 0 10px}
  .card.escuro{background:#fff;color:#000}
  .card.escuro h2,.card.escuro h3{color:#000}
  .ex,.item{background:#fff;break-inside:avoid}
  .aviso-bx{border-left:3px solid #000;background:#f4f4f4}
  .wrap{max-width:none;padding:0}
  a[href]:after{content:""}
}

/* ---------- agenda e honorários ---------- */
.agseg{display:flex;gap:8px;margin:0 0 14px}
.agseg button{flex:1;min-height:44px;padding:10px 8px;font-size:14px}
.agmes{display:flex;align-items:center;gap:10px;margin:0 0 12px}
.agmes b{flex:1;text-align:center;font-size:16px;text-transform:uppercase;letter-spacing:.05em}
.agmes button{min-height:44px;width:48px;padding:0;font-size:20px;line-height:1}
.agdow{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:0 0 6px}
.agdow span{text-align:center;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--tinta2)}
.aggrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.agdia{position:relative;min-height:48px;aspect-ratio:auto;padding:2px;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:2px;border:1px solid transparent;background:transparent;border-radius:10px;
  font-weight:600;font-size:15px;color:var(--tinta2)}
.agdia.vaz{visibility:hidden}
.agdia.hoje{border-color:var(--linha);color:var(--tinta)}
.agdia.tem{background:#fffaf0;border-color:var(--linha);color:var(--tinta)}
.agdia.sel{background:var(--ouro);border-color:var(--ouro2);color:#20180a}
.agdia i{font-style:normal;font-size:10px;font-weight:700;line-height:1;padding:2px 6px;border-radius:99px;
  background:#d7ecdf;color:var(--verde)}
.agdia.sel i{background:rgba(0,0,0,.18);color:#20180a}
.agdia .oco{height:13px}
.agitem{display:flex;gap:12px;align-items:center;padding:12px;border:1px solid var(--linha);border-radius:10px;
  background:#fffaf0;margin:0 0 8px;width:100%;text-align:left;min-height:56px}
.agitem .cx{width:26px;height:26px;flex:0 0 auto;border:2px solid var(--linha);border-radius:7px;
  display:flex;align-items:center;justify-content:center;font-size:15px;color:transparent;font-weight:800}
.agitem.on .cx{background:var(--verde);border-color:var(--verde);color:#fff}
.agitem .nm{flex:1;font-weight:700}
.agitem .vl{font-size:14px;color:var(--tinta2);font-variant-numeric:tabular-nums}
.agitem.on .vl{color:var(--verde);font-weight:700}
.agtot{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--linha);
  font-variant-numeric:tabular-nums}
.agtot b{font-size:17px}
.agval{display:flex;align-items:center;gap:10px;margin:0 0 8px}
.agval span{flex:1;font-weight:600}
.agval input{width:118px;min-height:44px;text-align:right;font-variant-numeric:tabular-nums}
td.rr,th.rr{text-align:right;font-variant-numeric:tabular-nums}
.agfl{border:1px solid var(--linha);border-radius:10px;background:#fffaf0;padding:12px;margin:0 0 10px}
.agfl .lin{display:flex;align-items:baseline;gap:10px}
.agfl .nm{flex:1;font-weight:700;font-size:16px}
.agfl .tt{font-variant-numeric:tabular-nums;font-size:17px;white-space:nowrap}
.agfl .det{font-size:13px;color:var(--tinta2);margin-top:2px;font-variant-numeric:tabular-nums}
.agfl .btns.h button{flex:1 1 130px}

/* ---------- biblioteca de programas ---------- */
.item .cx{width:24px;height:24px;flex:0 0 auto;border:2px solid var(--linha);border-radius:7px;
  display:flex;align-items:center;justify-content:center;font-size:14px;color:transparent;font-weight:800}
.item.marcado .cx{background:var(--verde);border-color:var(--verde);color:#fff}
.alunobox{margin:0 0 14px}
.alunoprog{display:flex;gap:10px;align-items:center;margin:6px 0 0}
.alunoprog label{margin:0;font-size:12px;color:var(--tinta2);white-space:nowrap;font-weight:600}
.alunoprog select{flex:1;min-height:44px;padding:8px 10px}

/* ---------- marcações diárias (dor e esforço) ---------- */
.agmarcas{display:flex;gap:8px;padding:0 12px 12px;margin:-4px 0 8px;flex-wrap:wrap}
.agmarcas > div{flex:1 1 140px;display:flex;align-items:center;gap:8px}
.agmarcas label{font-size:12px;font-weight:600;color:var(--tinta2);white-space:nowrap}
.agmarcas select{min-height:44px;padding:6px 8px;flex:1}
.agbloco{border:1px solid var(--linha);border-radius:10px;background:#fffaf0;margin:0 0 10px;overflow:hidden}
.agbloco .agitem{border:0;border-radius:0;margin:0;background:transparent}

/* ---------- gauntlet r1: sinais de dor e resumo ---------- */
.agbloco.alerta{border-color:var(--vermelho);box-shadow:inset 3px 0 0 var(--vermelho)}
.agmarcas .regua{flex:1 1 100%;font-size:11.5px;color:var(--tinta2);margin:-2px 0 0;font-style:italic}
.agdia .pt{position:absolute;top:4px;right:5px;width:8px;height:8px;border-radius:50%;background:var(--vermelho);box-shadow:0 0 0 2px var(--perg)}
.agresumo{display:flex;gap:10px;justify-content:space-between;font-size:13px;color:var(--tinta2);
  border-top:1px solid var(--linha);margin-top:10px;padding-top:10px;font-variant-numeric:tabular-nums}
.agresumo b{color:var(--tinta)}
.marcas-hist{width:100%;border-collapse:collapse;font-size:14px;margin-top:4px}
.marcas-hist td{padding:7px 4px;border-bottom:1px solid var(--linha);font-variant-numeric:tabular-nums}
.marcas-hist tr:last-child td{border-bottom:0}
.marcas-hist .alto{color:var(--vermelho);font-weight:700}

/* ---------- gauntlet r2: telas de 320px ---------- */
nav.bar button{min-width:0}
nav.bar button span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media(max-width:360px){
  nav.bar button{font-size:10px;padding:4px 2px}
  .agmarcas > div{flex:1 1 100%}
}
</style>

<header><div class="wrap hd">
  <svg viewBox="0 0 64 64" role="img" aria-label="David Jack Personal">

      <line x1="16" y1="46" x2="48" y2="18"/><line x1="16" y1="18" x2="48" y2="46"/>

    <g fill="#c9a227">
      <rect x="11" y="13" width="6" height="10" rx="2"/><rect x="47" y="13" width="6" height="10" rx="2"/>
      <rect x="11" y="41" width="6" height="10" rx="2"/><rect x="47" y="41" width="6" height="10" rx="2"/>

<main class="wrap" id="app"></main>

<div class="desc" id="desc"><div class="wrap">
  <div class="t" id="descT">01:00</div>
  <div class="btns h" style="margin-top:8px">
    <button class="mini esc" id="descMais" type="button">+15s</button>
    <button class="mini esc" id="descPular" type="button">Pular descanso</button>
  </div>
</div></div>

<nav class="bar"><div class="in" id="nav"></div></nav>

<script>
"use strict";

/* ============================================================
   DADOS — biblioteca de exercícios e regras por perfil
   Regras de perfis.md. Tags de restrição:
   axial  = carga comprimindo a coluna       impacto = salto/corrida
   dorsal = deitado de barriga para cima     valsalva = tende a prender a respiração
   ombroalto = braço acima da cabeça         joelhofundo = joelho muito flexionado
   equilibrio = exige equilíbrio             preensao = exige força de mão
   ============================================================ */
const EQ_LIVRE = "peso do corpo";

const LIB = [
/* --- membros inferiores --- */
{id:"agach_livre", n:"Agachamento livre com barra", g:"quadriceps", eq:["barras e anilhas"], t:["axial","valsalva","joelhofundo"], nv:2, cue:"Peito aberto, joelho na direção do pé."},
{id:"agach_gob", n:"Agachamento goblet (halter no peito)", g:"quadriceps", eq:["halteres","kettlebell"], t:["joelhofundo"], nv:1, cue:"Desça até onde a lombar não arredondar."},
{id:"leg_press", n:"Leg press", g:"quadriceps", eq:["maquinas guiadas"], t:["joelhofundo"], nv:1, cue:"Não deixe a lombar descolar do encosto."},
{id:"agach_cad", n:"Agachamento na cadeira (sentar e levantar)", g:"quadriceps", eq:[EQ_LIVRE], t:[], nv:1, cue:"Sente encostando de leve e levante sem impulso."},
{id:"afundo", n:"Afundo / passada", g:"quadriceps", eq:[EQ_LIVRE,"halteres"], t:["equilibrio","joelhofundo"], nv:2, uni:true, cue:"Tronco ereto, joelho de trás quase no chão."},
{id:"extensora", n:"Cadeira extensora", g:"quadriceps", eq:["maquinas guiadas"], t:["joelhofundo"], nv:1, cue:"Sem estender com tranco no fim."},

function idadeDe(f){
  const d = f?.identificacao?.nascimento; if(!d) return null;
  const n = new Date(d+"T12:00:00"); if(isNaN(n)) return null;
  const h = new Date(); let a = h.getFullYear()-n.getFullYear();
  const m = h.getMonth()-n.getMonth();
  if(m<0 || (m===0 && h.getDate()<n.getDate())) a--;
  return a;
}
function nomeDe(f){ return f?.identificacao?.nome || "Aluno sem nome"; }
function perfilDe(f){ return PERFIS[f?.perfil?.tipo] ? f.perfil.tipo : "outro"; }

/* --- equipamento declarado (peso do corpo sempre existe) --- */
function equipDe(f){
  const e = (f?.local?.equipamentos||[]).map(x=>String(x).toLowerCase().trim());
  return [EQ_LIVRE].concat(e);
}
function temEquip(ex, eqs){
  return ex.eq.some(req => eqs.some(t => t===req || t.indexOf(req)>=0 || req.indexOf(t)>=0));
}

/* --- restrições vindas da anamnese --- */
function restricoesDe(f){
  const tags = new Set(), grupos = new Set(), avisos = [];
  const p = PERFIS[perfilDe(f)];
  (p.proibe||[]).forEach(t=>tags.add(t));

  (f?.saude?.lesoes||[]).forEach(l=>{
    if(l.status==="resolvida") return;
    MAPA_LESAO.forEach(m=>{ if(m.re.test(l.local||"")){
      m.tags.forEach(t=>tags.add(t)); m.grupos.forEach(g=>grupos.add(g));
      avisos.push("Lesão em "+l.local+(l.status?" ("+l.status.replace("_"," ")+")":"")+": exercícios que agravam esse ponto foram retirados.");
    }});
  });
  (f?.saude?.dores||[]).forEach(d=>{
    if((d.intensidade0a10||0) < 3) return;
    MAPA_LESAO.forEach(m=>{ if(m.re.test(d.local||"")){
      m.tags.forEach(t=>tags.add(t)); m.grupos.forEach(g=>grupos.add(g));
      avisos.push("Dor em "+d.local+" (nota "+d.intensidade0a10+"): amplitude e seleção ajustadas.");
    }});
  });
  (f?.saude?.doencas||[]).forEach(dz=>{
    MAPA_DOENCA.forEach(m=>{ if(m.re.test(dz.nome||"")){
      m.tags.forEach(t=>tags.add(t)); if(m.aviso) avisos.push(m.aviso);
    }});
  });
  if(f?.parq?.problemaCardiacoOuPressao) tags.add("valsalva");
  if(f?.parq?.tonturaOuDesmaio) tags.add("equilibrio");
  const g = f?.especifico?.gestante;
  if(g && g.semanaGestacional >= 14) tags.add("dorsal");
  return {tags, grupos, avisos:[...new Set(avisos)]};
}

/* --- travas: o que impede prescrever --- */
function bloqueiosDe(f){
  const out = [];
  const bloq = (t,d)=>out.push({nivel:"bloqueio", t, d});
  const av   = (t,d)=>out.push({nivel:"aviso", t, d});
  const id = idadeDe(f);
  const lib = f?.saude?.liberacaoMedica || {};

  if(f?.consentimento?.lgpd !== true)
    bloq("Sem consentimento LGPD","A ficha só pode ser guardada e usada com a autorização do aluno registrada.");
  if(f?.parq?.dorNoPeito)
    bloq("Relata dor no peito","Avaliação médica antes de qualquer treino. Não prescreva.");
  if(f?.parq?.positivo && !lib.obtida)
    bloq("PAR-Q+ positivo sem liberação médica por escrito","Peça a liberação antes de intensidade moderada ou alta.");
  if(f?.perfil?.tipo === "gestante" && !lib.obtida)
    bloq("Gestante sem liberação obstétrica por escrito","Regra do perfil 4: não prescrever sem o documento.");
  if(id !== null && id < 18 && !(f?.identificacao?.responsavel?.autorizacaoTreino || f?.especifico?.handebol?.autorizacaoResponsavel))
    bloq("Menor de 18 anos sem autorização do responsável","Registre a autorização antes de prescrever.");

  if(f?.parq?.tonturaOuDesmaio)
    av("Tontura ou desmaio nos últimos 12 meses","Exercícios com apoio; nada em superfície instável.");
  if(f?.parq?.medicamentoCronico && !(f?.saude?.medicamentos||[]).length)
    av("Declara medicação contínua, mas não listou os remédios","Sem a lista, não use frequência cardíaca para controlar a intensidade — use a percepção de esforço.");
  if(lib.obtida === false && lib.restricoes && /verbal/i.test(lib.restricoes))
    av("A liberação médica é apenas verbal","O documento escrito é o que permite subir a intensidade.");
  if((f?.especifico?.corrida) && f?.especifico?.corrida?.correHoje === false)
    av("Nunca correu","A corrida começa por caminhada e trote alternados; o impacto é o que mais machuca iniciante.");
  ((f?.saude?.sinaisAlerta)||[]).forEach(s=>av("Sinal de alerta na ficha", s));
  return out;
}

/* --- exercícios que sobram depois das restrições --- */
function disponiveis(f){
  const eqs = equipDe(f), r = restricoesDe(f);
  return LIB.filter(ex =>
    temEquip(ex, eqs) &&
    !ex.t.some(t => r.tags.has(t)) &&
    !r.grupos.has(ex.g)
  );
}

/* --- montagem do programa --- */
const SLOTS_FULL = [
  {g:["quadriceps"], rot:0}, {g:["posterior","gluteo"], rot:0}, {g:["costas"], rot:0},
  {g:["peito"], rot:0}, {g:["ombro"], rot:0}, {g:["core"], rot:0},
  {g:["panturrilha"], rot:0}, {g:["biceps","triceps"], rot:0}, {g:["mobilidade"], rot:0}
];
const DIV_ALT = [
  {nome:"A — Empurrar", g:["peito","ombro","triceps","core"]},
  {nome:"B — Pernas",   g:["quadriceps","gluteo","panturrilha","core"]},
  {nome:"C — Puxar",    g:["costas","biceps","ombro","core"]},
  {nome:"D — Posterior e glúteo", g:["posterior","gluteo","panturrilha","core"]},
  {nome:"E — Leve e mobilidade",  g:["mobilidade","core","gluteo"]}
];

function escolher(cands, usadosSessao, usadosSemana, prefer){
  if(!cands.length) return null;
  const pontua = ex => {
    let p = 0;
    if(prefer && prefer.indexOf(ex.id)>=0) p -= 100;
    if(usadosSessao.has(ex.id)) p += 1000;
    p += (usadosSemana.get(ex.id)||0) * 40;
    p += ex.nv * 3;                      // prefere o mais simples
    return p;
  };
  return cands.slice().sort((a,b)=>pontua(a)-pontua(b))[0];
}

function gerarPrograma(f, cfg){
  cfg = cfg||{};
  const tipo = perfilDe(f), P = PERFIS[tipo];
  const disp = disponiveis(f);
  const r = restricoesDe(f);
  const dias = (f?.disponibilidade?.dias||[]).slice();
  const freqDecl = f?.disponibilidade?.diasSemana || dias.length || 0;
  let freq = cfg.freq || Math.min(Math.max(freqDecl || P.freq[0], P.freq[0]), P.freq[1]);
  if(tipo === "corredor_iniciante_10k") freq = 2;

  const obrig = (P.obrigatorios||[]).filter(id => disp.some(e=>e.id===id));
  const usadosSemana = new Map();
  const sessoes = [];
  const alternada = P.divisao === "alternada" && freq >= 4;
  const nEx = P.nEx[1];

  for(let s=0; s<freq; s++){
    const molde = alternada ? DIV_ALT[s % DIV_ALT.length] : null;
    const gruposDaSessao = molde ? molde.g : SLOTS_FULL.map(x=>x.g).flat();
    const usadosSessao = new Set();
    const itens = [];
    const ordemGrupos = [];

    if(molde){
      molde.g.forEach(g=>ordemGrupos.push([g]));
      molde.g.forEach(g=>ordemGrupos.push([g]));         // segunda passada preenche
    } else {
      SLOTS_FULL.forEach(sl=>{
        const ehEnfase = sl.g.some(g=>(P.enfase||[]).indexOf(g)>=0);
        ordemGrupos.push(sl.g);
        if(ehEnfase) ordemGrupos.push(sl.g);
      });
    }

    for(const gs of ordemGrupos){
      if(itens.length >= nEx) break;
      const cands = disp.filter(e => gs.indexOf(e.g)>=0);
      const ex = escolher(cands, usadosSessao, usadosSemana, obrig);
      if(!ex || usadosSessao.has(ex.id)) continue;
      usadosSessao.add(ex.id);
      usadosSemana.set(ex.id, (usadosSemana.get(ex.id)||0)+1);
      itens.push(montarItem(ex, P, f));
    }

    sessoes.push({
      id:"s"+(s+1),
      nome: molde ? molde.nome : "Treino "+String.fromCharCode(65+s),
      dia: dias[s] || "",
      aquecimento: aquecimentoDe(f, disp),
      itens,
      cardio: cardioDe(f, P, disp)
    });
  }

  /* garante os obrigatórios do perfil em algum lugar da semana */
  obrig.forEach(id=>{
    if(sessoes.some(s=>s.itens.some(i=>i.exId===id))) return;
    const ex = disp.find(e=>e.id===id); if(!ex) return;
    const alvo = sessoes.slice().sort((a,b)=>a.itens.length-b.itens.length)[0];
    if(alvo) alvo.itens.push(montarItem(ex, P, f));
  });

  const prog = {
    versao: 1,
    criadoEm: new Date().toISOString(),
    status: "rascunho",
    perfil: tipo,
    perfilNome: P.nome,
    objetivo: P.objetivo,
    regra: P.regra,
    freq,
    divisao: alternada ? "alternada" : "corpo inteiro",
    series: P.series, reps: P.reps, pse: P.pse, descanso: P.descanso,
    sessoes,
    progressao: progressaoDe(P),
    descarga: tipo==="homem_meia_idade_diario"
      ? "Semana de descarga a cada 4 a 6 semanas: metade das séries, mesma carga."
      : "Semana de descarga a cada 6 a 8 semanas: metade das séries, mesma carga.",
    planoB: planoBDe(sessoes),
    parar: ["Dor ou aperto no peito","Falta de ar desproporcional","Palpitação","Tontura ou desmaio",
            "Dor articular aguda","Dor que piora a cada sessão"],
    avisos: r.avisos,
    ressalva: "A técnica de cada exercício precisa ser conferida presencialmente pelo personal antes de o aluno treinar sozinho. Nenhum suplemento ou substância é prescrito aqui.",
    reavaliacao: emDias(56)
  };
  if(tipo === "corredor_iniciante_10k"){
    prog.corrida = {fases:FASES_CORRIDA, semanas:CORRIDA,
      obs:"Dois treinos de corrida por semana (curto e longo) e um terceiro opcional. Esforço até 6 de 10; se o médico indicar zonas de frequência cardíaca, elas substituem a percepção de esforço."};
  }
  prog.volume = volumeDe(prog);
  return prog;
}

function montarItem(ex, P, f){
  return {exId:ex.id, series:P.series[1], reps:P.reps, descanso:P.descanso, pse:P.pse, obs:""};
}
function aquecimentoDe(f, disp){
  const mob = disp.filter(e=>e.g==="mobilidade").slice(0,2).map(e=>e.n);
  const c = disp.find(e=>e.g==="cardio");
  const l = [];
  if(c) l.push("5 minutos de "+c.n.toLowerCase()+" em ritmo leve");
  mob.forEach(m=>l.push(m+" — 8 repetições lentas"));
  l.push("Primeira série de cada exercício com metade da carga");
  return l;
}
function cardioDe(f, P, disp){
  const c = disp.find(e=>e.g==="cardio");
  if(!c || !P.cardio) return null;
  return {nome:(P.cardio.ex==="caminhada"||P.cardio.ex.indexOf("plano")>=0) ? P.cardio.ex : c.n,
          min:P.cardio.min, obs:P.cardio.obs};
}
function progressaoDe(P){
  return "Quando conseguir todas as séries no topo da faixa de "+P.reps+" repetições, com esforço "+
    "dentro de "+P.pse+", aumente a carga entre 2% e 5% na sessão seguinte. Se travar duas semanas no mesmo peso, "+
    "mantenha a carga e ganhe uma repetição por série antes de subir de novo.";
}
function planoBDe(sessoes){
  const base = sessoes[0]?.itens?.slice(0,4)||[];
  return {min:30, itens:base.map(i=>({exId:i.exId, series:2, reps:i.reps, descanso:60, pse:i.pse}))};
}
function volumeDe(prog){
  const v = {};
  prog.sessoes.forEach(s=>s.itens.forEach(i=>{
    const ex = LIB.find(e=>e.id===i.exId); if(!ex || ex.g==="cardio" || ex.g==="mobilidade") return;
    v[ex.g] = (v[ex.g]||0) + (Number(i.series)||0);
  }));
  return v;
}
function emDias(n){ const d = new Date(); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); }
function exDe(id){ return LIB.find(e=>e.id===id) || {id, n:"(exercício removido)", g:"core", eq:[], t:[], nv:1, cue:""}; }

/* ---------- avisos e caixas ---------- */
let toastT;
function toast(msg){
  document.querySelectorAll(".toast").forEach(t=>t.remove());
  const d = document.createElement("div"); d.className="toast"; d.textContent=msg; d.setAttribute("role","status");
  document.body.appendChild(d); clearTimeout(toastT); toastT=setTimeout(()=>d.remove(), 3400);
}
function modal(html){
  const d = document.createElement("div"); d.className="modal";
  d.innerHTML = '<div class="in">'+html+'</div>';
  d.addEventListener("click", e=>{ if(e.target===d) d.remove(); });
  document.body.appendChild(d); return d;
}
function pergunta(titulo, texto, okTxt){
  return new Promise(res=>{
    const d = modal('<h2>'+esc(titulo)+'</h2><p class="sub">'+esc(texto)+'</p>'+
      '<div class="btns"><button class="pri" id="pOk">'+esc(okTxt||"Confirmar")+'</button>'+
      '<button id="pNao">Cancelar</button></div>');
    d.querySelector("#pOk").onclick = ()=>{ d.remove(); res(true); };
    d.querySelector("#pNao").onclick = ()=>{ d.remove(); res(false); };
  });
}

/* ---------- arquivos ---------- */
function baixar(nome, texto){
  try{
    const b = new Blob([texto], {type:"application/json"});
    const u = URL.createObjectURL(b); const a = document.createElement("a");
    a.href=u; a.download=nome; document.body.appendChild(a); a.click();
    setTimeout(()=>{ URL.revokeObjectURL(u); a.remove(); }, 4000);
    toast("Arquivo "+nome+" gerado.");
  }catch(e){ verTexto(nome, texto); }
}
function verTexto(nome, texto){
  const d = modal('<h2>'+esc(nome)+'</h2><p class="sub">Copie o conteúdo abaixo.</p>'+
    '<textarea id="tx" style="min-height:240px"></textarea><div class="btns" style="margin-top:10px">'+
    '<button class="pri" id="cp">Copiar</button><button id="fc">Fechar</button></div>');
  d.querySelector("#tx").value = texto;
  d.querySelector("#cp").onclick = async ()=>{ try{ await navigator.clipboard.writeText(texto); toast("Copiado."); }
    catch(e){ d.querySelector("#tx").select(); } };
  d.querySelector("#fc").onclick = ()=>d.remove();
}
function abrirArquivo(cb){
  const inp = document.createElement("input"); inp.type="file"; inp.accept=".json,application/json";
  inp.style.display="none"; document.body.appendChild(inp);
  inp.onchange = ()=>{ const f = inp.files[0]; if(!f){ inp.remove(); return; }
    const fr = new FileReader();
    fr.onload = ()=>{ try{ cb(JSON.parse(fr.result)); }catch(e){ toast("Este arquivo não é um JSON válido."); } inp.remove(); };
    fr.onerror = ()=>{ toast("Não consegui ler o arquivo."); inp.remove(); };
    fr.readAsText(f); };
  inp.click();
}
function colarJson(titulo, cb){
  const d = modal('<h2>'+esc(titulo)+'</h2><p class="sub">Cole aqui o conteúdo do arquivo .json.</p>'+
    '<textarea id="tx" style="min-height:200px" placeholder="{ ... }"></textarea>'+
    '<div class="btns" style="margin-top:10px"><button class="pri" id="ok">Importar</button><button id="fc">Cancelar</button></div>');
  d.querySelector("#fc").onclick = ()=>d.remove();
  d.querySelector("#ok").onclick = ()=>{
    try{ const o = JSON.parse(d.querySelector("#tx").value); d.remove(); cb(o); }
    catch(e){ toast("O texto colado não é um JSON válido."); }
  };
}

function validarFicha(o){
  const p = [];
  if(!o || typeof o !== "object") return ["O arquivo não é um objeto JSON."];
  if(!o.identificacao || !o.identificacao.nome) p.push("falta identificacao.nome");
  if(!o.perfil || !o.perfil.tipo) p.push("falta perfil.tipo");
  if(!o.parq) p.push("falta o bloco parq");
  if(!o.saude) p.push("falta o bloco saude");
  if(!o.consentimento) p.push("falta o bloco consentimento");
  return p;
}
function importarFicha(o){
  const probs = validarFicha(o);
  if(probs.length){ toast("Ficha incompleta: "+probs.join(", ")+"."); return; }
  const nome = nomeDe(o);
  const existente = BD.alunos.find(a => nomeDe(a.ficha).toLowerCase() === nome.toLowerCase());
  if(existente){
    pergunta("Atualizar "+nome+"?", "Já existe uma ficha com esse nome. O histórico de treinos e de execuções é preservado.", "Atualizar")
      .then(ok=>{ if(!ok) return;
        existente.ficha = o; existente.atualizadoEm = new Date().toISOString();
        salvar(); BD.aluno_id = existente.id; ir("ficha"); toast("Ficha de "+nome+" atualizada."); });
    return;
  }
  const a = {id:uid(), ficha:o, programa:null, execucoes:[], criadoEm:new Date().toISOString()};
  BD.alunos.push(a); BD.aluno_id = a.id; salvar(); ir("ficha");
  toast(nome+" entrou na carteira.");
}

function honor(){
  if(!BD.honor || typeof BD.honor!=="object") BD.honor = {};
  const h = BD.honor;
  if(typeof h.valorPadrao !== "number" || !(h.valorPadrao>0)) h.valorPadrao = 55;
  if(!h.valores || typeof h.valores!=="object") h.valores = {};
  if(!h.aulas   || typeof h.aulas!=="object")   h.aulas   = {};
  if(!h.pagos   || typeof h.pagos!=="object")   h.pagos   = {};
  if(typeof h.pix   !== "string") h.pix = "";
  if(typeof h.assin !== "string") h.assin = "";
  return h;
}
function agIso(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function agHoje(){ return agIso(new Date()); }
function agMk(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0"); }
function brl(n){ return Number(n||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"}); }
function agNum(s){ const n = parseFloat(String(s).replace(/\./g,"").replace(",",".")); return isFinite(n)&&n>0 ? Math.round(n*100)/100 : 0; }
function valorAula(id){ const h=honor(); const v=h.valores[id]; return (typeof v==="number"&&v>0) ? v : h.valorPadrao; }
function agAlunos(){ return BD.alunos.map(a=>({id:a.id, nome:nomeDe(a.ficha)})).sort((x,y)=>x.nome.localeCompare(y.nome,"pt-BR")); }
function agNomeDe(id){ const a = BD.alunos.find(x=>x.id===id); return a ? nomeDe(a.ficha) : "(aluno removido)"; }
function agDoDia(dia){ const d = honor().aulas[dia]; return (d && typeof d==="object") ? d : {}; }
function aulaVal(x){ return typeof x === "number" ? x : (x && Number(x.v)) || 0; }
function aulaMarca(x, campo){ return (x && typeof x === "object" && x[campo] != null) ? String(x[campo]) : ""; }
function agMarcar(dia, id){
  const h = honor(); const d = h.aulas[dia] || (h.aulas[dia]={});
  if(d[id] !== undefined) delete d[id]; else d[id] = {v: valorAula(id)};
  if(!Object.keys(d).length) delete h.aulas[dia];
  salvar();
}
function agAnotar(dia, id, campo, valor){
  const h = honor(); const d = h.aulas[dia]; if(!d || d[id] === undefined) return;
  if(typeof d[id] === "number") d[id] = {v: d[id]};
  if(valor === "") delete d[id][campo]; else d[id][campo] = Number(valor);
  salvar();
}
/* fechamento: {id, nome, n, total, pago} do mês corrente */
function agFechamento(mk){
  const h = honor(); const por = {};
  Object.keys(h.aulas).forEach(dia=>{
    if(dia.slice(0,7) !== mk) return;
    const d = h.aulas[dia];
    Object.keys(d).forEach(id=>{
      const v = aulaVal(d[id]);
      if(!por[id]) por[id] = {id, nome:agNomeDe(id), n:0, total:0, uni:new Set()};
      por[id].n++; por[id].total += v; por[id].uni.add(v);
    });
  });
  return Object.values(por).map(l=>{
    l.unico = l.uni.size===1 ? Array.from(l.uni)[0] : null; delete l.uni;
    l.pago = !!h.pagos[l.id+"|"+mk]; return l;
  }).sort((a,b)=>a.nome.localeCompare(b.nome,"pt-BR"));
}
function agCopiar(txt){
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(()=>toast("Copiado."), ()=>agCopiar2(txt));
  } else agCopiar2(txt);
}
function agCopiar2(txt){
  const t = document.createElement("textarea"); t.value=txt; t.style.position="fixed"; t.style.opacity="0";
  document.body.appendChild(t); t.select();
  try{ document.execCommand("copy"); toast("Copiado."); }catch(e){ toast("Não consegui copiar."); }
  t.remove();
}
function agBaixarCsv(nome, texto){
  try{
    const b = new Blob(["﻿"+texto], {type:"text/csv;charset=utf-8"});
    const u = URL.createObjectURL(b); const a = document.createElement("a");
    a.href=u; a.download=nome; document.body.appendChild(a); a.click();
    setTimeout(()=>{ URL.revokeObjectURL(u); a.remove(); }, 4000);
    toast("Arquivo "+nome+" gerado.");
  }catch(e){ toast("Não consegui gerar o arquivo."); }
}
function agTextoCobranca(l, mk){
  const h = honor(); const p = mk.split("-");
  const prim = (l.nome.split(" ")[0] || l.nome);
  let t = "Olá, "+prim+"! Fechamento de "+AG_MESES[Number(p[1])-1]+"/"+p[0]+":\n"+
          "• Aulas realizadas: "+l.n+"\n"+
          (l.unico ? "• Valor da aula: "+brl(l.unico)+"\n" : "")+
          "• Total: "+brl(l.total);
  if(h.pix) t += "\n\nPix: "+h.pix;
  const assin = h.assin || BD.cfg.personal || "";
  if(assin) t += "\n"+assin;
  return t;
}


/* --- agenda: apoio ao histórico e ao resumo (gauntlet r1) --- */
let AG_rolar = false;
function aulasDoAluno(id){
  const h = honor(); const fora = [];
  Object.keys(h.aulas).forEach(dia => { if(h.aulas[dia][id] !== undefined) fora.push({dia, m: h.aulas[dia][id]}); });
  return fora.sort((a,b)=> a.dia < b.dia ? 1 : -1);
}
function limparAgendaDoAluno(id){
  const h = honor();
  Object.keys(h.aulas).forEach(dia => {
    delete h.aulas[dia][id];
    if(!Object.keys(h.aulas[dia]).length) delete h.aulas[dia];
  });
  Object.keys(h.pagos).forEach(k => { if(k.split("|")[0] === id) delete h.pagos[k]; });
  delete h.valores[id];
}
function resumoMes(mk){
  const linhas = agFechamento(mk);
  if(!linhas.length) return "";
  const aulas = linhas.reduce((s,l)=>s+l.n,0), total = linhas.reduce((s,l)=>s+l.total,0);
  const pago = linhas.filter(l=>l.pago).reduce((s,l)=>s+l.total,0);
  return '<div class="agresumo"><span>'+aulas+' aula'+(aulas>1?'s':'')+' no mês</span>'+
    '<span><b>'+brl(total)+'</b>'+(pago ? ' · '+brl(pago)+' recebido' : '')+'</span></div>';
}
function marcasDoAluno(a){
  const l = aulasDoAluno(a.id).filter(x => x.m && typeof x.m === "object" && (x.m.dor != null || x.m.pse != null)).slice(0,8);
  if(!l.length) return "";
  return '<h3>Dor e esforço nas últimas aulas</h3>'+
    '<table class="marcas-hist">'+l.map(x=>{
      const dia = x.dia.slice(8,10)+"/"+x.dia.slice(5,7);
      const dor = x.m.dor != null ? x.m.dor : "—", pse = x.m.pse != null ? x.m.pse : "—";
      return "<tr><td>"+dia+"</td><td"+(Number(dor)>=7?' class="alto"':"")+">dor "+dor+"</td><td>esforço "+pse+"</td></tr>";
    }).join("")+"</table>"+
    '<p class="dica">Dor 7 ou mais em duas aulas seguidas pede revisão de carga antes de progredir.</p>';
}

/* ============================================================
   BIBLIOTECA DE PROGRAMAS (modo personal)
   Modelos editáveis por categoria, atribuíveis a cada aluno.
   ============================================================ */
const CATS = [["idosos","Idosos"],["forca","Força"],["hipertrofia","Hipertrofia"],["cardio","Cardio"],["corrida","Corrida"]];
let MODELO_ID = null, CAT_FILTRO = "todos";

function modelos(){
  if(!Array.isArray(BD.modelos)){ BD.modelos = []; }
  if(!BD.modelos.length && !BD.modelosLimpos){
    BD.modelos = JSON.parse(JSON.stringify(MODELOS_PADRAO));
    salvar();
  }
  return BD.modelos;
}
function modeloDe(id){ return modelos().find(m=>m.id===id) || null; }
function catNome(c){ const x = CATS.find(y=>y[0]===c); return x ? x[1] : c; }
function idModelo(){ return "m" + Date.now().toString(36) + Math.random().toString(36).slice(2,5); }
function sessoesDe(m){ return m.s.reduce((t,w)=>t+w[2].length, 0); }
function alunosComModelo(id){ return BD.alunos.filter(a=>a.modeloId===id).length; }
function nomeModeloDe(a){ const m = a.modeloId ? modeloDe(a.modeloId) : null; return m ? m.nome : ""; }

/* ---------- abrir o WhatsApp (funciona também no app instalado) ---------- */
function telDe(f){ return String(f?.identificacao?.contato?.telefone || "").replace(/\D/g,""); }
function abrirWhats(tel, texto){
  const t = String(tel||"").replace(/\D/g,"");
  if(t.length < 10) return false;
  const numero = t.length <= 11 ? "55"+t : t;
  const url = "https://wa.me/" + numero + (texto ? "?text=" + encodeURIComponent(texto) : "");
  try{
    const a = document.createElement("a");
    a.href = url; a.target = "_blank"; a.rel = "noopener";
    document.body.appendChild(a); a.click(); a.remove();
  }catch(e){ location.href = url; }
  return true;
}

/* ---------- tela: lista de programas ---------- */
function telaProgramas(){
  const lista = modelos();
  const vis = CAT_FILTRO === "todos" ? lista : lista.filter(m=>m.cat===CAT_FILTRO);
  const chips = [["todos","Todos"]].concat(CATS).map(c=>
    '<button type="button" class="mini'+(CAT_FILTRO===c[0]?" pri":"")+'" data-cat="'+c[0]+'">'+esc(c[1])+
    (c[0]!=="todos" ? " ("+lista.filter(m=>m.cat===c[0]).length+")" : "")+"</button>").join("");

  const itens = vis.length ? vis.map(m=>{
    const n = alunosComModelo(m.id);
    return '<button class="item" type="button" data-m="'+m.id+'">'+
      '<span style="flex:1"><span class="nm">'+esc(m.nome)+"</span>"+
      '<span class="dt">'+esc(catNome(m.cat))+" · "+m.s.length+" semanas · "+sessoesDe(m)+" sessões"+
      (n ? " · "+n+" aluno(s)" : "")+"</span></span><span class='seta'>›</span></button>";
  }).join("") : '<div class="vazio">'+MARCA+'<p style="margin:10px 0 0">Nenhum programa nesta categoria.</p></div>';

  return {html:
    '<div class="card"><h2>Programas</h2>'+
    '<p class="sub">Modelos do escritório. Edite à vontade: o que você salvar aqui é o que vai para os alunos.</p>'+
    '<div class="btns h" style="margin-bottom:12px">'+chips+"</div>"+
    itens+
    '<div class="btns" style="margin-top:12px">'+
      '<button class="pri" id="bNovo">Novo programa</button>'+
      '<button id="bRest">Restaurar modelos de fábrica</button></div>'+
    '<p class="dica">Restaurar recoloca apenas os modelos de fábrica que foram apagados; não desfaz as suas edições.</p></div>',
    liga(){
      document.querySelectorAll("[data-cat]").forEach(b=>b.onclick=()=>{ CAT_FILTRO=b.dataset.cat; desenhar(); });
      document.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{ MODELO_ID=b.dataset.m; ir("modelo"); });
      $("#bNovo").onclick = ()=>criarModelo();
      $("#bRest").onclick = ()=>{
        const tem = new Set(modelos().map(m=>m.id));
        const faltam = MODELOS_PADRAO.filter(m=>!tem.has(m.id));
        if(!faltam.length){ toast("Todos os modelos de fábrica já estão aqui."); return; }
        BD.modelos = modelos().concat(JSON.parse(JSON.stringify(faltam)));
        salvar(); desenhar(); toast(faltam.length+" modelo(s) restaurado(s).");
      };
    }};
}

/* ---------- tela: um programa ---------- */
function telaModelo(){
  const m = modeloDe(MODELO_ID);
  if(!m) return {html:'<div class="card"><p class="vazio">Programa não encontrado.</p>'+
    '<div class="btns"><button class="pri" id="v">Voltar</button></div></div>',
    liga(){ $("#v").onclick=()=>ir("programas"); }};

  const semanas = m.s.map((w,i)=>
    '<section class="card"><div style="display:flex;gap:10px;align-items:center">'+
      '<div style="flex:1"><h2 style="font-size:16px">Semana '+w[0]+'</h2>'+
      '<p class="sub" style="margin:0">'+esc(w[1])+"</p></div>"+
      '<button class="mini" data-ed="'+i+'">Editar</button></div>'+
    w[2].map(t=>'<div class="ex"><div class="nome" style="font-weight:600">'+esc(t)+"</div></div>").join("")+
    "</section>").join("");

  const usados = alunosComModelo(m.id);
  return {html:
    '<div class="card"><div style="display:flex;gap:10px;align-items:flex-start">'+
      '<div style="flex:1"><h2>'+esc(m.nome)+"</h2>"+
      '<p class="sub" style="margin:2px 0 0">'+esc(m.meta||"")+"</p></div>"+
      '<span class="selo ok">'+esc(catNome(m.cat))+"</span></div>"+
    '<div class="btns h" style="margin:12px 0 0">'+
      '<span class="pill">'+m.s.length+" semanas</span><span class='pill'>"+sessoesDe(m)+" sessões</span>"+
      (usados?"<span class='pill'>"+usados+" aluno(s)</span>":"")+"</div>"+
    (m.paraQuem?'<h3>Para quem</h3><p class="sub" style="margin:0">'+esc(m.paraQuem)+"</p>":"")+

      '<button id="bSem">Acrescentar semana</button>'+

      '<button class="perigo" id="bDel">Excluir</button>'+

    semanas,
    liga(){
      document.querySelectorAll("[data-ed]").forEach(b=>b.onclick=()=>editarSemana(m, Number(b.dataset.ed)));
      $("#bDados").onclick = ()=>editarDadosModelo(m);
      $("#bAtr").onclick  = ()=>atribuirModelo(m);
      $("#bDup").onclick  = ()=>{
        const c = JSON.parse(JSON.stringify(m));
        c.id = idModelo(); c.nome = m.nome + " (cópia)";
        BD.modelos.push(c); salvar(); MODELO_ID = c.id; desenhar(); toast("Cópia criada. Edite à vontade.");
      };
      $("#bSem").onclick = ()=>{
        m.s.push([m.s.length+1, "Nova semana", ["A — "]]);
        salvar(); editarSemana(m, m.s.length-1);
      };
      $("#bDel").onclick = async ()=>{
        if(!await pergunta("Excluir "+m.nome+"?", usados
          ? usados+" aluno(s) estão com este programa e ficarão sem nenhum."
          : "O programa sai deste aparelho. Os modelos de fábrica podem ser restaurados depois.", "Excluir")) return;
        BD.modelos = modelos().filter(x=>x.id!==m.id);
        BD.alunos.forEach(a=>{ if(a.modeloId===m.id) a.modeloId = null; });
        BD.modelosLimpos = true;
        salvar(); ir("programas"); toast("Programa excluído.");
      };
      $("#bVolta").onclick = ()=>ir("programas");
    }};
}

function editarSemana(m, i){
  const w = m.s[i];
  const d = modal('<h2>Semana '+w[0]+"</h2>"+
    '<p class="sub">Uma sessão por linha. Linha em branco é ignorada.</p>'+
    '<label class="q" for="wFoco">Foco da semana</label><input id="wFoco" value="'+esc(w[1])+'">'+
    '<label class="q" for="wSes" style="margin-top:10px">Sessões</label>'+
    '<textarea id="wSes" style="min-height:190px">'+esc(w[2].join("\n"))+"</textarea>"+
    '<div class="btns" style="margin-top:14px"><button class="pri" id="wOk">Salvar</button>'+
    '<button id="wNao">Cancelar</button>'+
    '<button class="perigo" id="wDel">Excluir semana</button></div>');
  d.querySelector("#wNao").onclick = ()=>d.remove();
  d.querySelector("#wDel").onclick = ()=>{
    m.s.splice(i,1); m.s.forEach((x,j)=>x[0]=j+1);
    salvar(); d.remove(); desenhar(); toast("Semana excluída.");
  };
  d.querySelector("#wOk").onclick = ()=>{
    const ses = d.querySelector("#wSes").value.split("\n").map(s=>s.trim()).filter(Boolean);
    if(!ses.length){ toast("A semana precisa de pelo menos uma sessão."); return; }
    w[1] = d.querySelector("#wFoco").value.trim() || "Semana "+w[0];
    w[2] = ses;
    salvar(); d.remove(); desenhar(); toast("Semana salva.");
  };
}

function atribuirModelo(m){
  if(!BD.alunos.length){ toast("Não há alunos na carteira ainda."); return; }
  const linhas = BD.alunos.slice().sort((a,b)=>nomeDe(a.ficha).localeCompare(nomeDe(b.ficha),"pt-BR")).map(a=>{
    const marcado = a.modeloId === m.id;
    const outro = a.modeloId && !marcado ? modeloDe(a.modeloId) : null;
    return '<button type="button" class="item" data-a="'+a.id+'" data-on="'+marcado+'">'+
      '<span class="cx" aria-hidden="true">✓</span>'+
      '<span style="flex:1"><span class="nm">'+esc(nomeDe(a.ficha))+"</span>"+
      (outro?'<span class="dt">hoje com '+esc(outro.nome)+"</span>":"")+"</span></button>";
  }).join("");
  const d = modal('<h2>Quem recebe este programa</h2>'+
    '<p class="sub">Cada aluno fica com um programa por vez. Tocar de novo tira.</p>'+linhas+
    '<div class="btns" style="margin-top:14px"><button class="pri" id="aOk">Pronto</button></div>');
  d.querySelectorAll("[data-a]").forEach(b=>{
    const pinta = ()=>{ b.classList.toggle("marcado", b.dataset.on==="true"); };
    pinta();
    b.onclick = ()=>{ b.dataset.on = b.dataset.on==="true" ? "false" : "true"; pinta(); };
  });
  d.querySelector("#aOk").onclick = ()=>{
    let n = 0;
    d.querySelectorAll("[data-a]").forEach(b=>{
      const a = BD.alunos.find(x=>x.id===b.dataset.a); if(!a) return;
      if(b.dataset.on==="true"){ if(a.modeloId!==m.id) n++; a.modeloId = m.id; }
      else if(a.modeloId===m.id){ a.modeloId = null; }
    });
    salvar(); d.remove(); desenhar();
    toast(n ? n+" aluno(s) passaram a usar este programa." : "Atribuições atualizadas.");
  };
}

function semaforo(f){
  const b = bloqueiosDe(f);
  if(f && f.anamnesePendente) return {cls:"aviso", txt:"anamnese pendente"};
  if(b.some(x=>x.nivel==="bloqueio")) return {cls:"bloq", txt:"não liberar"};
  if(b.length) return {cls:"aviso", txt:"com ressalva"};
  return {cls:"ok", txt:"liberado"};
}

/* ---------- perfis: escolher e criar ---------- */
function perfisOrdenados(){
  return Object.keys(PERFIS).sort((a,b)=>PERFIS[a].nome.localeCompare(PERFIS[b].nome,"pt-BR"));
}
function idPerfil(nome){
  return "p_" + String(nome).normalize("NFD").replace(/[̀-ͯ]/g,"")
    .replace(/[^A-Za-z0-9]+/g,"_").toLowerCase().slice(0,28) + "_" + Math.random().toString(36).slice(2,5);
}
function criarPerfil(cb){
  const cmp = (id,rot,val,extra)=>'<label class="q" for="'+id+'" style="margin-top:10px">'+rot+"</label>"+
    '<input id="'+id+'" value="'+esc(val)+'" '+(extra||"")+">";

    '<p class="sub">O perfil define o esqueleto do treino que o motor propõe: frequência, séries, repetições e esforço.</p>'+

    '<label class="q" for="pDiv" style="margin-top:10px">Divisão</label>'+
    '<select id="pDiv"><option value="corpo inteiro">corpo inteiro</option>'+
    '<option value="alternada">alternada (superior/inferior)</option></select>'+
    '<div class="grid2">'+
      '<div>'+cmp("pFreq","Sessões por semana","3",'inputmode="numeric"')+"</div>"+
      '<div>'+cmp("pEx","Exercícios por sessão","7",'inputmode="numeric"')+"</div>"+
      '<div>'+cmp("pSer","Séries","3",'inputmode="numeric"')+"</div>"+
      '<div>'+cmp("pDesc","Descanso (segundos)","75",'inputmode="numeric"')+"</div>"+
      '<div>'+cmp("pReps","Repetições","8 a 12")+"</div>"+
      '<div>'+cmp("pPse","Esforço (1 a 10)","6 a 7")+"</div>"+
    "</div>"+
    cmp("pObj","Objetivo","")+
    '<div class="btns" style="margin-top:14px"><button class="pri" id="pOk">Criar perfil</button>'+
    '<button id="pNao">Cancelar</button></div>');
  d.querySelector("#pNao").onclick = ()=>d.remove();
  d.querySelector("#pOk").onclick = ()=>{
    const v = id => d.querySelector("#"+id).value.trim();
    const n = id => { const x = parseInt(v(id),10); return isFinite(x)&&x>0 ? x : 0; };
    const nome = v("pNome");
    if(!nome){ toast("O perfil precisa de um nome."); d.querySelector("#pNome").focus(); return; }
    const freq = n("pFreq")||3, ser = n("pSer")||3, nex = n("pEx")||7, desc = n("pDesc")||75;
    const base = JSON.parse(JSON.stringify(PERFIS.outro));
    const p = Object.assign(base, {
      nome: nome, divisao: d.querySelector("#pDiv").value,
      freq:[freq,freq], series:[Math.max(1,ser-1),ser], nEx:[Math.max(3,nex-1),nex],
      reps: v("pReps")||"8 a 12", pse: v("pPse")||"6 a 7", descanso: desc,
      objetivo: v("pObj") || "Perfil criado pelo personal.",
      regra: "Perfil criado à mão no app por "+(BD.cfg.personal||"o personal")+"."
    });
    const k = idPerfil(nome);
    BD.perfisExtra = BD.perfisExtra || {};
    BD.perfisExtra[k] = p; PERFIS[k] = p; salvar(); d.remove();
    toast("Perfil "+nome+" criado.");
    if(cb) cb(k); else desenhar();
  };
}

/* o que o personal precisa para progredir carga: o que o aluno levantou */
function evolucaoCargas(a){
  const m={};
  (a.execucoes||[]).forEach(e=>(e.itens||[]).forEach(it=>{
    const c=Math.max.apply(null,(it.series||[]).map(x=>Number(x.carga)||0).concat([0]));
    if(!c) return;
    (m[it.exId]=m[it.exId]||[]).push({data:e.data, carga:c});
  }));
  return Object.keys(m).map(id=>{
    const l=m[id].sort((x,y)=> x.data<y.data?-1:1);
    return {id, n:l.length, ini:l[0], fim:l[l.length-1]};
  }).sort((x,y)=> y.n-x.n);
}
function arq(s){ return String(s).normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^A-Za-z0-9 ]/g,"").trim().toLowerCase().replace(/\s+/g,"-"); }

function importarPacote(o){
  if(!o || o.tipo!=="pacote-david-jack" || !o.programa){ toast("Este arquivo não é um treino do David Jack Personal."); return; }
  BD.pacote = o; BD.emCurso = null; salvar(); ir("treino");
  toast("Treino de "+(o.aluno?.nome||"você")+" carregado.");
}
function diasDaSemana(){
  const ex = BD.execucoes||[], hoje = new Date(); const out=[];
  for(let i=6;i>=0;i--){
    const d = new Date(hoje); d.setDate(hoje.getDate()-i);
    const iso = d.toISOString().slice(0,10);
    out.push({iso, letra:["D","S","T","Q","Q","S","S"][d.getDay()], feito: ex.some(e=>e.data===iso), hoje:i===0});
  }
  return out;
}
function sequencia(){
  const set = new Set((BD.execucoes||[]).map(e=>e.data));
  if(!set.size) return 0;
  let n=0; const d=new Date();
  for(let s=0;s<52;s++){
    let achou=false;
    for(let k=0;k<7;k++){ const x=new Date(d); x.setDate(d.getDate()-(s*7+k)); if(set.has(x.toISOString().slice(0,10))){ achou=true; break; } }
    if(achou) n++; else break;
  }
  return n;
}
function ultimaVezDe(nome){
  const e=(BD.execucoes||[]).filter(x=>x.sessao===nome).slice(-1)[0];
  return e ? e.data : null;
}
function proximaSessao(p){
  if(!p.sessoes.length) return null;
  let alvo=0, maisAntiga="9999";
  p.sessoes.forEach((s,i)=>{ const u=ultimaVezDe(s.nome)||"0000"; if(u<maisAntiga){ maisAntiga=u; alvo=i; } });
  return alvo;
}
function minutosDe(s){
  let seg=0; s.itens.forEach(it=>{ seg += (Number(it.series)||0) * (45 + (Number(it.descanso)||60)); });
  return Math.max(15, Math.round((seg+300)/60));
}

/* ---------- cronômetro de descanso ---------- */
let descT=null, descS=0;
function iniciarDescanso(seg){
  pararDescanso(); descS=Number(seg)||60;
  const cx=$("#desc"), tx=$("#descT");
  cx.classList.add("on"); document.body.classList.add("comdesc"); tx.textContent=fmt(descS);
  descT=setInterval(()=>{
    descS--; tx.textContent=fmt(Math.max(0,descS));
    cx.classList.toggle("urgente", descS<=10);
    if(descS<=0){ pararDescanso(); vibrar([60,80,60]); toast("Descanso terminado. Próxima série."); }
  },1000);
}
function pararDescanso(){
  if(descT) clearInterval(descT); descT=null;
  const c=$("#desc"); if(c){ c.classList.remove("on"); c.classList.remove("urgente"); }
  document.body.classList.remove("comdesc");
}
function fmt(s){ const m=Math.floor(s/60), r=s%60; return String(m).padStart(2,"0")+":"+String(r).padStart(2,"0"); }

    (ex.length? ex.slice().reverse().map(e=>'<div class="item"><span style="flex:1">'+
      '<span class="nm">'+esc(e.sessao)+'</span><span class="dt">'+esc(e.data)+' · '+e.series+
      (e.seriesPrevistas?" de "+e.seriesPrevistas:"")+' séries'+
      (e.pseMedio?' · esforço '+e.pseMedio:"")+(e.dor?' · relatou dor':"")+'</span></span></div>').join("")
      : '<div class="vazio">'+MARCA+'<p style="margin:10px 0 0">Nenhum treino registrado ainda.</p></div>')+
    '<div class="btns" style="margin-top:12px">'+
    '<button class="pri" id="bExp">Exportar para o personal (.json)</button></div>'+
    '<p class="dica">Mande este arquivo ao personal de vez em quando: é com ele que o treino é ajustado.</p></div>',
    liga(){
      $("#bExp").onclick=()=>{
        if(!ex.length){ toast("Não há nada para exportar ainda."); return; }
        baixar("registro - "+arq(BD.pacote?.aluno?.nome||"aluno")+".json",
          JSON.stringify({tipo:"registro-david-jack", v:1, aluno:BD.pacote?.aluno||{}, execucoes:ex},null,2));
      };
    }};
}

function telaAjustes(){
  const p = BD.modo==="personal";
  return {html:
    '<div class="card"><h2>Ajustes</h2>'+
    (p?'<label class="q" for="nm">Seu nome</label><input id="nm" value="'+esc(BD.cfg.personal||"")+'">'+
       '<label class="q" for="cf" style="margin-top:12px">CREF</label><input id="cf" value="'+esc(BD.cfg.cref||"")+'" placeholder="000000-G/CE">'+
       '<div class="btns" style="margin-top:12px"><button class="pri" id="bSalvar">Salvar</button></div>'
      :'<p class="sub">Modo aluno. O treino e o histórico ficam só neste aparelho.</p>'+
       '<div class="btns"><button class="pri" id="bPac">Carregar outro treino</button></div>')+
    '<hr class="linha">'+
    '<h3>Cópia de segurança</h3><p class="sub">Tudo o que está neste aparelho, num arquivo só.</p>'+
    '<div class="btns"><button id="bBk">Exportar cópia de tudo</button><button id="bRest">Restaurar de uma cópia</button></div>'+
    '<hr class="linha">'+
    '<h3>Modo do aparelho</h3><p class="sub">Agora: <b>'+(p?"personal":"aluno")+'</b>.</p>'+
    '<div class="btns"><button id="bModo2">Trocar de modo</button>'+
    '<button class="perigo" id="bZerar">Apagar tudo deste aparelho</button></div>'+
    '<hr class="linha"><p class="sub" style="margin:0">Os dados ficam no navegador deste aparelho, sem servidor. '+
    'Dados de saúde são sensíveis: exporte a cópia de segurança para um lugar seguro e não empreste o aparelho destravado.</p></div>',
    liga(){
      const bs=$("#bSalvar"); if(bs) bs.onclick=()=>{ BD.cfg.personal=$("#nm").value.trim(); BD.cfg.cref=$("#cf").value.trim(); salvar(); desenhar(); toast("Salvo."); };
      const bp=$("#bPac"); if(bp) bp.onclick=()=>abrirArquivo(importarPacote);
      $("#bBk").onclick=()=>baixar("copia david jack personal - "+new Date().toISOString().slice(0,10)+".json", JSON.stringify(BD,null,2));
      $("#bRest").onclick=()=>abrirArquivo(async o=>{
        if(!o || !o.v){ toast("Este arquivo não é uma cópia do aplicativo."); return; }
        if(!await pergunta("Restaurar?","O conteúdo atual deste aparelho será substituído pelo da cópia.","Restaurar")) return;
        BD=Object.assign({v:1, alunos:[], cfg:{}}, o); salvar(); ir(BD.modo==="personal"?"alunos":"treino"); toast("Cópia restaurada.");
      });
      $("#bModo2").onclick=()=>{ BD.modo=null; salvar(); desenhar(); };
      $("#bZerar").onclick=async ()=>{
        if(!await pergunta("Apagar tudo?","Fichas, programas e histórico saem deste aparelho. Não dá para desfazer.","Apagar tudo")) return;
        try{ localStorage.removeItem(CHAVE); }catch(e){}
        BD={v:1, modo:null, cfg:{personal:"David Cordeiro", cref:""}, alunos:[], aluno_id:null};
        desenhar(); toast("Tudo apagado.");
      };
    }};
}
function telaModo(){
  return {html:
    '<div class="card escuro" style="text-align:center">'+MARCA_G+
    '<h2 style="margin-top:12px">Quem vai usar este aparelho?</h2>'+
    '<p class="sub">Dá para trocar depois em Ajustes.</p>'+
    '<div class="btns">'+
    '<button class="pri" id="mP">Sou o personal</button>'+
    '<button class="esc" id="mA">Sou aluno</button></div></div>'+
    '<div class="card"><h3 style="margin-top:0">O que muda</h3>'+
    '<p class="sub" style="margin:0">No modo <b>personal</b> você importa as fichas de anamnese, revisa o programa que o motor propõe e libera o treino. '+
    'No modo <b>aluno</b> o aparelho carrega o treino que o personal mandou e serve para executar e registrar as séries.</p></div>',
    liga(){
      $("#mA").onclick=()=>{ BD.modo="aluno"; salvar(); ir("treino"); };
      $("#mP").onclick=()=>{
        const d=modal('<h2>Código do personal</h2><p class="sub">Serve para o aluno não abrir a carteira sem querer. É tranca de armário, não cofre.</p>'+
          '<label class="q" for="cd">Código</label><input id="cd" placeholder="código" autocomplete="off"><div class="btns" style="margin-top:10px">'+
          '<button class="pri" id="ok">Entrar</button><button id="fc">Cancelar</button></div>');
        const tenta=()=>{ if(d.querySelector("#cd").value.trim().toUpperCase()===CODIGO_PERSONAL){ d.remove(); BD.modo="personal"; salvar(); ir("alunos"); }
          else toast("Código errado."); };
        d.querySelector("#ok").onclick=tenta;
        d.querySelector("#cd").onkeydown=ev=>{ if(ev.key==="Enter") tenta(); };
        d.querySelector("#fc").onclick=()=>d.remove();
      };
    }};
}

/* ============================================================
   DESENHO E INÍCIO
   ============================================================ */
function desenhar(){
  const app=$("#app"); let t;
  if(!BD.modo){ t=telaModo(); $("#nav").innerHTML=""; $("#btModo").classList.add("oculto"); }
  else{
    $("#btModo").classList.remove("oculto");
    $("#btModo").textContent = BD.modo==="personal" ? "personal" : "aluno";
    const mapa = BD.modo==="personal"
      ? {alunos:telaAlunos, ficha:telaFicha, programa:telaPrograma, programas:telaProgramas, modelo:telaModelo, agenda:telaAgenda, ajustes:telaAjustes}
      : {treino:telaTreino, hist:telaHist, ajustes:telaAjustes, progaluno:telaProgAluno};
    const abas = ABAS[BD.modo].map(x=>x[0]);
    if(!mapa[TELA]) TELA = abas[0];
    t = mapa[TELA]();
    desenharNav();
  }
  $("#hdSub").textContent = BD.modo==="personal"
    ? (BD.cfg.personal||"personal")+(BD.cfg.cref?" · CREF "+BD.cfg.cref:"")
    : (BD.pacote?.aluno?.nome || "Treino sob medida");
  app.innerHTML = t.html; t.liga();
}
